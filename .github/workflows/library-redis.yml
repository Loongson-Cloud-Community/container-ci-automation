name: "Build/library/redis"

on:
  schedule:
    - cron: '0 16 * * *'      # 北京时间 00:00
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号（留空=自动检测）'
        required: false
        type: string

jobs:
  build:
    uses: ./.github/workflows/build-push.yml
    with:
      project: library/redis
      version: ${{ inputs.version || '' }}
